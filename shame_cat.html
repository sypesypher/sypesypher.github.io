<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shame Cat</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
		}

		body {
			display: grid;
			place-items: center;
			background: #000;
			color: #fff;
		}

		figure {
			margin: 0;
			text-align: center;
		}

		img {
			max-width: 100vw;
			max-height: calc(100vh - 3rem);
			object-fit: contain;
		}

		figcaption {
			padding: 0.5rem 1rem;
			font-family: sans-serif;
		}
	</style>
</head>
<body>
	<figure>
		<img src="Images/shame_cat.png" alt="Shame cat">
		<figcaption>What were you expecting to see here? 👀</figcaption>
	</figure>
</body>
</html>
